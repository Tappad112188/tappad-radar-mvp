name: TAPPAD Radar - SECOP prueba en nube
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extraer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desarrollo-registro-proveedores
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Extraer procedimientos vigentes publicados hoy
        env:
          TAPPAD_HEADLESS: '1'
        run: python extractor_secop_hoy_vigentes.py
      - name: Guardar reporte de diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secop-diagnostico
          path: secop_hoy_vigentes.json
          if-no-files-found: warn

name: Mercado Pago - auditoria privada SOLO LECTURA
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: tappad-auditoria-comercial
  cancel-in-progress: false
jobs:
  auditoria:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: comercial-lectura
    env:
      TAPPAD_SUPABASE_URL: ${{ secrets.TAPPAD_SUPABASE_URL }}
      TAPPAD_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TAPPAD_SUPABASE_SERVICE_ROLE_KEY }}
      TAPPAD_MERCADOPAGO_PROD_ACCESS_TOKEN: ${{ secrets.TAPPAD_MERCADOPAGO_PROD_ACCESS_TOKEN }}
      TAPPAD_HABILITAR_ACTIVACION_PRODUCCION: 'NO'
      TAPPAD_HABILITAR_REVERSION_PRODUCCION: 'NO'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desarrollo-registro-proveedores
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verificar secretos configurados sin mostrarlos
        shell: bash
        run: |
          if [[ -z "$TAPPAD_SUPABASE_URL" || -z "$TAPPAD_SUPABASE_SERVICE_ROLE_KEY" || -z "$TAPPAD_MERCADOPAGO_PROD_ACCESS_TOKEN" ]]; then
            echo "::notice::Auditoria no ejecutada: faltan secretos del entorno comercial-lectura."
            exit 0
          fi
          python conciliador_pagos_pendientes_lectura.py

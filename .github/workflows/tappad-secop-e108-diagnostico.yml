name: TAPPAD SECOP E108 prueba real portal y compuerta
on:
  push:
    branches: [desarrollo-registro-proveedores]
    paths: ['.github/workflows/tappad-secop-e108-diagnostico.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar-secop:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Consultar SECOP hoy con Chromium
        env:
          TAPPAD_HEADLESS: '1'
        run: python extractor_secop_hoy_vigentes.py
      - name: Confirmar procedimiento E108 en respuesta oficial
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('secop_hoy_vigentes.json').read_text(encoding='utf-8'))
          for r in d.get('registros',[]):
              print('SECOP:',r['codigo'],'|',r['fecha_publicacion'],'|',r['estatus'])
          a=[r for r in d.get('registros',[]) if r['codigo']=='SIDUM-AI3-CO-E108-2026']
          if not a: raise SystemExit('No se encontró E108 en el lote oficial de hoy')
          print('E108 encontrada en SECOP oficial. Calendario documental sigue pendiente.')
          PY

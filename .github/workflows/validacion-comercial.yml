name: Validacion comercial sin servicios externos
on:
  workflow_dispatch:
  push:
    branches:
      - desarrollo-registro-proveedores
    paths:
      - 'tests/test_invariantes_comerciales.py'
      - 'tests/test_activacion_privada_postgres.py'
      - 'tests/test_acceso_comercial_secop.py'
      - 'entregar_alertas_secop.py'
      - 'motor_entrega_tappad_v2.py'
      - 'conciliacion_comercial_mercadopago.py'
      - 'verificar_pago_mercadopago_servidor.py'
      - 'conexion_segura_mercadopago_supabase.py'
      - 'aplicar_activacion_comercial_controlada.py'
      - 'activacion_privada_postgres.py'
      - 'auditar_estados_remotos_mercadopago.py'
      - 'tests/test_auditar_estados_remotos_mercadopago.py'
      - 'politica_estados_mercadopago.py'
      - 'tests/test_politica_estados_mercadopago.py'
      - 'politica_renovacion_mercadopago.py'
      - 'tests/test_politica_renovacion_mercadopago.py'
      - 'conciliador_pagos_pendientes_lectura.py'
      - 'tests/test_conciliador_pagos_pendientes_lectura.py'
      - 'worker_activacion_comercial.py'
      - 'tests/test_worker_activacion_comercial.py'
      - 'tests/test_activacion_privada_postgres.py'
      - 'tests/test_aplicar_activacion_comercial_controlada.py'
      - 'tests/test_flujo_integral_comercial_simulado.py'
      - 'tests/test_conexion_segura_mercadopago_supabase.py'
      - 'tests/test_verificar_pago_mercadopago_servidor.py'
      - 'tests/test_conciliacion_mercadopago.py'
      - '.github/workflows/validacion-comercial.yml'
permissions:
  contents: read
jobs:
  pruebas-locales:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Comprobar sintaxis sin importar ni ejecutar el sistema
        run: python -m py_compile entregar_alertas_secop.py motor_entrega_tappad_v2.py conciliacion_comercial_mercadopago.py verificar_pago_mercadopago_servidor.py conexion_segura_mercadopago_supabase.py aplicar_activacion_comercial_controlada.py activacion_privada_postgres.py tests/test_activacion_privada_postgres.py tests/test_aplicar_activacion_comercial_controlada.py tests/test_flujo_integral_comercial_simulado.py tests/test_conexion_segura_mercadopago_supabase.py tests/test_verificar_pago_mercadopago_servidor.py tests/test_invariantes_comerciales.py tests/test_acceso_comercial_secop.py tests/test_conciliacion_mercadopago.py worker_activacion_comercial.py tests/test_worker_activacion_comercial.py politica_renovacion_mercadopago.py tests/test_politica_renovacion_mercadopago.py conciliador_pagos_pendientes_lectura.py tests/test_conciliador_pagos_pendientes_lectura.py politica_estados_mercadopago.py tests/test_politica_estados_mercadopago.py auditar_estados_remotos_mercadopago.py tests/test_auditar_estados_remotos_mercadopago.py
      - name: Ejecutar pruebas con dependencias simuladas
        run: python -m unittest discover -s tests -p 'test_invariantes_comerciales.py' -v && python -m unittest discover -s tests -p 'test_acceso_comercial_secop.py' -v && python -m unittest discover -s tests -p 'test_conciliacion_mercadopago.py' -v && python -m unittest discover -s tests -p 'test_verificar_pago_mercadopago_servidor.py' -v && python -m unittest discover -s tests -p 'test_conexion_segura_mercadopago_supabase.py' -v && python -m unittest discover -s tests -p 'test_aplicar_activacion_comercial_controlada.py' -v && python -m unittest discover -s tests -p 'test_flujo_integral_comercial_simulado.py' -v && python -m unittest discover -s tests -p 'test_activacion_privada_postgres.py' -v && python -m unittest discover -s tests -p 'test_worker_activacion_comercial.py' -v && python -m unittest discover -s tests -p 'test_politica_renovacion_mercadopago.py' -v && python -m unittest discover -s tests -p 'test_conciliador_pagos_pendientes_lectura.py' -v && python -m unittest discover -s tests -p 'test_politica_estados_mercadopago.py' -v && python -m unittest discover -s tests -p 'test_auditar_estados_remotos_mercadopago.py' -v

name: Validacion comercial sin servicios externos
on:
  workflow_dispatch:
  push:
    branches:
      - desarrollo-registro-proveedores
    paths:
      - 'tests/test_invariantes_comerciales.py'
      - 'tests/test_acceso_comercial_secop.py'
      - 'entregar_alertas_secop.py'
      - '.github/workflows/validacion-comercial.yml'
permissions:
  contents: read
jobs:
  pruebas-locales:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Comprobar sintaxis sin importar ni ejecutar el sistema
        run: python -m py_compile entregar_alertas_secop.py tests/test_invariantes_comerciales.py tests/test_acceso_comercial_secop.py
      - name: Ejecutar pruebas con dependencias simuladas
        run: python -m unittest discover -s tests -p 'test_*.py' -v

name: TAPPAD Radar - importacion programada ComprasMX
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/actualizar_licitaciones.yml'
  schedule:
    - cron: '0 14 * * *'
    - cron: '0 19 * * *'
    - cron: '0 0 * * *'
permissions:
  contents: read
concurrency:
  group: tappad-importacion-comprasmx
  cancel-in-progress: false
jobs:
  importar-comprasmx:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener version validada del piloto
        uses: actions/checkout@v4
        with:
          ref: 883ef02a4875e0292589d8201acaa666be5de5d7
          persist-credentials: false
      - name: Obtener correccion acotada de deteccion
        uses: actions/checkout@v4
        with:
          ref: ece61d2351721445f521fc46b98fdf429ea59445
          path: correccion-deteccion
          persist-credentials: false
      - name: Aplicar solo manifiesto corregido y sus pruebas
        run: |
          cp correccion-deteccion/generar_manifiesto_comprasmx_automatico.py ./generar_manifiesto_comprasmx_automatico.py
          cp correccion-deteccion/tests/test_seleccion_recientes_comprasmx.py ./tests/test_seleccion_recientes_comprasmx.py
          rm -rf correccion-deteccion
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencia Supabase
        run: python -m pip install 'supabase>=2,<3'
      - name: Probar seleccion de novedades
        run: python -m unittest discover -s tests -p test_seleccion_recientes_comprasmx.py -v
      - name: Verificar secretos y remitente autorizado
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ADMIN_KEY: ${{ secrets.SUPABASE_ADMIN_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          names=('SUPABASE_URL','SUPABASE_ADMIN_KEY','SMTP_USER','SMTP_APP_PASSWORD')
          missing=[name for name in names if not os.getenv(name)]
          if missing: raise SystemExit('Faltan secretos: '+', '.join(missing))
          if os.environ['SMTP_USER'].strip().casefold()!='tappadcons@gmail.com':
              raise SystemExit('Remitente fuera del piloto')
          print('Credenciales presentes y remitente autorizado')
          PY
      - name: Importar ComprasMX sin duplicados
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ADMIN_KEY: ${{ secrets.SUPABASE_ADMIN_KEY }}
        run: python tappad_importador_automatico.py --ventana-dias 2 --limite 10000 --importar
      - name: Generar logotipo corporativo valido
        run: |
          python -m pip install 'cairosvg==2.8.2'
          python - <<'PY'
          import cairosvg
          from pathlib import Path
          p=Path('assets')
          cairosvg.svg2png(url=str(p/'logo_tappad.svg'),write_to=str(p/'logo_tappad.png'),output_width=330,output_height=330)
          assert (p/'logo_tappad.png').read_bytes().startswith(bytes.fromhex('89504e470d0a1a0a'))
          PY
      - name: Preparar alertas y entregar solo a suscripciones comercialmente habilitadas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ADMIN_KEY: ${{ secrets.SUPABASE_ADMIN_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          TAPPAD_ENVIO_REAL: SI
          TAPPAD_PILOTO_REAL: SI
        run: |
          python generar_manifiesto_comprasmx_automatico.py
          python motor_entrega_tappad_v2.py --enviar-real
      - name: Resumen de ejecucion
        if: always()
        run: |
          echo "## TAPPAD Radar - ComprasMX" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run: $GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- Resultado: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Hora Coahuila: $(TZ=America/Monterrey date +%Y-%m-%d\ %H:%M:%S)" >> "$GITHUB_STEP_SUMMARY"

name: TAPPAD Radar - importacion programada ComprasMX

on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *'
    - cron: '0 19 * * *'
    - cron: '0 0 * * *'

permissions:
  contents: read

concurrency:
  group: tappad-importacion-comprasmx
  cancel-in-progress: false

jobs:
  importar-comprasmx:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener archivos del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencia de Supabase
        run: python -m pip install 'supabase>=2,<3'

      - name: Diagnostico de ejecucion
        run: |
          echo "Run ID: $GITHUB_RUN_ID"
          echo "Evento: $GITHUB_EVENT_NAME"
          echo "Inicio UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Inicio Coahuila: $(TZ=America/Monterrey date +%Y-%m-%dT%H:%M:%S%z)"

      - name: Importar expedientes recientes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ADMIN_KEY: ${{ secrets.SUPABASE_ADMIN_KEY }}
        run: python tappad_importador_automatico.py --dias 2 --limite 1000 --importar

      - name: Resumen de ejecucion
        if: always()
        run: |
          echo "## TAPPAD Radar - ComprasMX" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run: $GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- Resultado: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Fecha local: $(TZ=America/Monterrey date +%Y-%m-%d\ %H:%M:%S)" >> "$GITHUB_STEP_SUMMARY"

name: TAPPAD Radar - importacion ComprasMX

on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *'
    - cron: '0 19 * * *'
    - cron: '0 0 * * *'

permissions:
  contents: read

concurrency:
  group: tappad-importacion-comprasmx
  cancel-in-progress: false

jobs:
  importar-comprasmx:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener archivos del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Supabase
        run: python -m pip install 'supabase>=2,<3'

      - name: Importar expedientes recientes ComprasMX
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ADMIN_KEY: ${{ secrets.SUPABASE_ADMIN_KEY }}
        run: python tappad_importador_automatico.py --ventana-dias 2 --limite 10000 --importar

      - name: Preparar alertas con preferencias SAT CUCOP sin enviar correos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ADMIN_KEY: ${{ secrets.SUPABASE_ADMIN_KEY }}
        run: python diagnostico_integral_comprasmx_catalogos.py


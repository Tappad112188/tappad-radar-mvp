name: TAPPAD Radar - importacion ComprasMX

on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *'
    - cron: '0 19 * * *'
    - cron: '0 0 * * *'

permissions:
  contents: read

concurrency:
  group: tappad-importacion-comprasmx
  cancel-in-progress: false

jobs:
  importar-comprasmx:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener archivos del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Supabase
        run: python -m pip install 'supabase>=2,<3'

      - name: Importar expedientes recientes ComprasMX
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ADMIN_KEY: ${{ secrets.SUPABASE_ADMIN_KEY }}
        run: python tappad_importador_automatico.py --ventana-dias 2 --limite 10000 --importar

      - name: Preparar alertas con preferencias SAT CUCOP sin enviar correos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ADMIN_KEY: ${{ secrets.SUPABASE_ADMIN_KEY }}
        run: python diagnostico_integral_comprasmx_catalogos.py


      - name: Generar manifiesto automatico y validar motor sin enviar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ADMIN_KEY: ${{ secrets.SUPABASE_ADMIN_KEY }}
        run: |
          python generar_manifiesto_comprasmx_automatico.py
          python motor_entrega_tappad_v2.py

      - name: Entrega piloto automatizada exclusivamente con autorizacion explicita
        if: ${{ vars.TAPPAD_COMPRASMX_PILOTO_AUTOMATICO == 'SI' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ADMIN_KEY: ${{ secrets.SUPABASE_ADMIN_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          TAPPAD_PILOTO_REAL: SI
          TAPPAD_ENVIO_REAL: SI
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          if os.environ.get('SMTP_USER','').strip().casefold()!='tappadcons@gmail.com':
              raise SystemExit('Remitente SMTP no autorizado')
          if not os.environ.get('SMTP_APP_PASSWORD'):
              raise SystemExit('Secreto SMTP no configurado')
          ruta=Path('manifiesto_notificaciones_tappad.json')
          manifiesto=json.loads(ruta.read_text(encoding='utf-8'))
          if manifiesto.get('modo')!='SOLO_PREPARACION':
              raise SystemExit('Manifiesto no autorizado')
          lotes=manifiesto.get('proveedores')
          if not isinstance(lotes,list):
              raise SystemExit('Lotes no validos')
          piloto=[]
          for lote in lotes:
              if lote.get('cliente_id') not in (1,4):
                  continue
              ids=lote.get('licitacion_ids')
              if not isinstance(ids,list) or not ids or len(ids)!=len(set(ids)) or len(ids)>25:
                  raise SystemExit('Lote piloto invalido')
              piloto.append(lote)
          manifiesto['proveedores']=piloto
          ruta.write_text(json.dumps(manifiesto,ensure_ascii=False,indent=2),encoding='utf-8')
          print('PILOTO AUTOMATICO:',len(piloto),'clientes')
          PY
          python motor_entrega_tappad_v2.py --enviar-real

name: Verificar respaldo restaurable Supabase (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restauracion:
    runs-on: ubuntu-24.04
    environment: respaldo-supabase
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: temporal_ci
          POSTGRES_DB: restauracion_tappad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d restauracion_tappad"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Verificar herramientas PostgreSQL 17
        run: docker run --rm postgres:17 pg_dump --version
      - name: Verificar copia lógica y restauración aislada
        env:
          TAPPAD_POSTGRES_DSN: ${{ secrets.TAPPAD_POSTGRES_DSN }}
          PGCONNECT_TIMEOUT: '15'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TAPPAD_POSTGRES_DSN:-}" || { echo 'BLOQUEADO: falta DSN de lectura para respaldo'; exit 1; }
          umask 077
          backup_dir="$(mktemp -d)"
          trap 'rm -rf "$backup_dir"' EXIT
          # No registrar DSN, contraseñas ni contenido del volcado.
          docker run --rm --network host -e TAPPAD_POSTGRES_DSN -e PGCONNECT_TIMEOUT postgres:17 sh -c 'exec pg_dump --dbname="$TAPPAD_POSTGRES_DSN" --format=custom --no-owner --no-acl --schema=public --schema=tappad_internal --enable-row-security --inserts' > "$backup_dir/backup.dump"
          test -s "$backup_dir/backup.dump"
          docker run --rm -i postgres:17 pg_restore --list < "$backup_dir/backup.dump" > "$backup_dir/objetos.txt"
          test -s "$backup_dir/objetos.txt"
          # La restauración de una BD Supabase completa puede requerir extensiones,
          # roles y servicios propios; nunca afirmar éxito si falla.
          export PGPASSWORD=temporal_ci
          docker run --rm --network host -e PGPASSWORD postgres:17 psql --host=localhost --port=5432 --username=postgres --dbname=restauracion_tappad --no-psqlrc --set=ON_ERROR_STOP=1 --command="DROP SCHEMA public;"
          # Dependencias simuladas exclusivamente para restaurar los esquemas de aplicación.
          local_sql() {
            docker run --rm -i --network host -e PGPASSWORD postgres:17 psql --host=localhost --port=5432 --username=postgres --dbname=restauracion_tappad --no-psqlrc --set=ON_ERROR_STOP=1 "$@"
          }
          local_sql > /dev/null <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE ROLE tappad_activador_privado NOLOGIN;
          CREATE ROLE tappad_backup_reader NOLOGIN;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $$ SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          CREATE SCHEMA extensions;
          CREATE EXTENSION pgcrypto WITH SCHEMA extensions;
          CREATE EXTENSION "uuid-ossp" WITH SCHEMA extensions;
          SQL
          restore_section() {
            docker run --rm -i --network host -e PGPASSWORD postgres:17 pg_restore --host=localhost --port=5432 --username=postgres --dbname=restauracion_tappad --no-owner --no-acl --exit-on-error --section="$1" < "$backup_dir/backup.dump" > "$backup_dir/restore.log" 2>&1 || { echo "FALLO_RESTAURACION_SECCION_$1 (detalle privado omitido)"; exit 1; }
          }
          restore_section pre-data
          restore_section data
          local_sql > /dev/null <<'SQL'
          INSERT INTO auth.users(id)
          SELECT usuario_id FROM public.usuarios_clientes_tappad
          UNION SELECT usuario_id FROM public.administradores_tappad
          ON CONFLICT DO NOTHING;
          SQL
          restore_section post-data
          local_sql --tuples-only --command="SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE'" > "$backup_dir/resultado.txt"
          test "$(tr -d '[:space:]' < "$backup_dir/resultado.txt")" = 21
          echo 'RESTAURACION_PARCIAL_APLICACION_CON_AUTH_SIMULADO_VALIDADA; NO ES RESPALDO INTEGRAL NI COPIA RETENIDA'

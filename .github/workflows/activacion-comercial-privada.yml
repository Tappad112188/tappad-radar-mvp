name: Activacion comercial privada (bloqueada por defecto)
on:
  workflow_dispatch:
    inputs:
      pago_id:
        description: ID interno del pago conciliado
        required: true
        type: string
      confirmar:
        description: PLANES, CREAR_PLANES, VERIFICAR, ACTIVAR, PILOTO_LECTURA o PILOTO_APLICAR
        required: true
        type: string
permissions:
  contents: read
jobs:
  activar:
    if: ${{ (inputs.confirmar == 'ACTIVAR' || inputs.confirmar == 'VERIFICAR' || inputs.confirmar == 'PLANES' || inputs.confirmar == 'CREAR_PLANES' || inputs.confirmar == 'PILOTO_LECTURA' || inputs.confirmar == 'PILOTO_APLICAR') }}
    runs-on: ubuntu-latest
    environment: activacion-comercial
    concurrency:
      group: tappad-activacion-comercial
      cancel-in-progress: false
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar driver PostgreSQL
        run: python -m pip install 'psycopg[binary]==3.2.10'
      - name: Validar secretos sin imprimirlos
        env:
          TAPPAD_POSTGRES_DSN: ${{ secrets.TAPPAD_POSTGRES_DSN }}
          TAPPAD_SUPABASE_URL: ${{ secrets.TAPPAD_SUPABASE_URL }}
          TAPPAD_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TAPPAD_SUPABASE_SERVICE_ROLE_KEY }}
          TAPPAD_MERCADOPAGO_PROD_ACCESS_TOKEN: ${{ secrets.TAPPAD_MERCADOPAGO_PROD_ACCESS_TOKEN }}
          TAPPAD_MERCADOPAGO_SELLER_ID: ${{ secrets.TAPPAD_MERCADOPAGO_SELLER_ID }}
        run: |
          python - <<'PY'
          import os
          required=('TAPPAD_POSTGRES_DSN','TAPPAD_SUPABASE_URL',
                    'TAPPAD_SUPABASE_SERVICE_ROLE_KEY',
                    'TAPPAD_MERCADOPAGO_PROD_ACCESS_TOKEN',
                    'TAPPAD_MERCADOPAGO_SELLER_ID')
          missing=[x for x in required if not os.getenv(x)]
          if missing: raise SystemExit('Faltan secretos del entorno: '+', '.join(missing))
          PY
      - name: Inventario de planes productivos
        if: ${{ inputs.confirmar == 'PLANES' }}
        env:
          TAPPAD_MERCADOPAGO_PROD_ACCESS_TOKEN: ${{ secrets.TAPPAD_MERCADOPAGO_PROD_ACCESS_TOKEN }}
          TAPPAD_MERCADOPAGO_SELLER_ID: ${{ secrets.TAPPAD_MERCADOPAGO_SELLER_ID }}
        run: python preflight_planes_productivos.py
      - name: Crear planes productivos sin suscripciones
        if: ${{ inputs.confirmar == 'CREAR_PLANES' }}
        env:
          CONFIRMAR: ${{ inputs.confirmar }}
          TAPPAD_MERCADOPAGO_PROD_ACCESS_TOKEN: ${{ secrets.TAPPAD_MERCADOPAGO_PROD_ACCESS_TOKEN }}
          TAPPAD_MERCADOPAGO_SELLER_ID: ${{ secrets.TAPPAD_MERCADOPAGO_SELLER_ID }}
        run: python crear_planes_productivos.py
      - name: Verificar registro historico sin escrituras
        if: ${{ inputs.confirmar == 'VERIFICAR' }}
        env:
          TAPPAD_SUPABASE_URL: ${{ secrets.TAPPAD_SUPABASE_URL }}
          TAPPAD_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TAPPAD_SUPABASE_SERVICE_ROLE_KEY }}
          TAPPAD_MERCADOPAGO_PROD_ACCESS_TOKEN: ${{ secrets.TAPPAD_MERCADOPAGO_PROD_ACCESS_TOKEN }}
          TAPPAD_MERCADOPAGO_SELLER_ID: ${{ secrets.TAPPAD_MERCADOPAGO_SELLER_ID }}
          PAGO_ID: ${{ inputs.pago_id }}
        run: |
          python - <<'PY'
          import os
          from conexion_segura_mercadopago_supabase import _filas
          from verificar_pago_mercadopago_servidor import verificar_pago_servidor
          url=os.environ['TAPPAD_SUPABASE_URL']
          key=os.environ['TAPPAD_SUPABASE_SERVICE_ROLE_KEY']
          p=_filas(url,key,'pagos_tappad',{'id':'eq.'+str(int(os.environ['PAGO_ID']))})
          s=_filas(url,key,'suscripciones_tappad',{'id':'eq.'+str(p['suscripcion_id'])})
          pl=_filas(url,key,'planes_tappad',{'id':'eq.'+str(s['plan_id'])})
          if p['proveedor_cobro'] != 'mercadopago_prueba' or s['proveedor_cobro'] != 'mercadopago_prueba' or s['estado'] != 'prueba':
              raise SystemExit('Registro historico no admisible')
          print('Plan activo:',pl['activo'],'(solo diagnostico; no autoriza activacion)')
          e=verificar_pago_servidor(dict(s,proveedor_cobro='mercadopago_produccion'),dict(p,proveedor_cobro='mercadopago_produccion'),importe_esperado=pl['precio_mxn'],periodicidad=pl['periodicidad'],token=os.environ['TAPPAD_MERCADOPAGO_PROD_ACCESS_TOKEN'])
          if e['seller_id'] != os.environ['TAPPAD_MERCADOPAGO_SELLER_ID']:
              raise SystemExit('Vendedor inesperado')
          print('PAGO_PRODUCTIVO_VERIFICADO; SIN_ESCRITURAS; pago interno:',p['id'])
          PY
      - name: Ejecutar una activacion privada
        if: ${{ inputs.confirmar == 'ACTIVAR' }}
        env:
          TAPPAD_HABILITAR_ACTIVACION_PRODUCCION: ${{ secrets.TAPPAD_HABILITAR_ACTIVACION_PRODUCCION }}
          TAPPAD_POSTGRES_DSN: ${{ secrets.TAPPAD_POSTGRES_DSN }}
          TAPPAD_SUPABASE_URL: ${{ secrets.TAPPAD_SUPABASE_URL }}
          TAPPAD_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TAPPAD_SUPABASE_SERVICE_ROLE_KEY }}
          TAPPAD_MERCADOPAGO_PROD_ACCESS_TOKEN: ${{ secrets.TAPPAD_MERCADOPAGO_PROD_ACCESS_TOKEN }}
          TAPPAD_MERCADOPAGO_SELLER_ID: ${{ secrets.TAPPAD_MERCADOPAGO_SELLER_ID }}
          PAGO_ID: ${{ inputs.pago_id }}
        run: |
          python - <<'PY'
          import os
          from activacion_privada_postgres import activar_conexion_privada
          pago=int(os.environ['PAGO_ID'])
          resultado=activar_conexion_privada(
            pago,
            supabase_url=os.environ['TAPPAD_SUPABASE_URL'],
            supabase_key=os.environ['TAPPAD_SUPABASE_SERVICE_ROLE_KEY'],
            mercadopago_token=os.environ['TAPPAD_MERCADOPAGO_PROD_ACCESS_TOKEN'],
            postgres_dsn=os.environ['TAPPAD_POSTGRES_DSN'],
            permitir=True)
          print('Resultado:',resultado['aplicacion'],'pago interno:',pago)
          PY

      - name: Conciliar piloto
        if: ${{ inputs.confirmar == 'PILOTO_LECTURA' || inputs.confirmar == 'PILOTO_APLICAR' }}
        env:
          TAPPAD_POSTGRES_DSN: ${{ secrets.TAPPAD_POSTGRES_DSN }}
          TAPPAD_SUPABASE_URL: ${{ secrets.TAPPAD_SUPABASE_URL }}
          TAPPAD_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TAPPAD_SUPABASE_SERVICE_ROLE_KEY }}
          TAPPAD_MERCADOPAGO_PROD_ACCESS_TOKEN: ${{ secrets.TAPPAD_MERCADOPAGO_PROD_ACCESS_TOKEN }}
          TAPPAD_MERCADOPAGO_SELLER_ID: ${{ secrets.TAPPAD_MERCADOPAGO_SELLER_ID }}
          TAPPAD_HABILITAR_ACTIVACION_PRODUCCION: ${{ secrets.TAPPAD_HABILITAR_ACTIVACION_PRODUCCION }}
          TAPPAD_HABILITAR_CONCILIACION_PILOTO: ${{ inputs.confirmar == 'PILOTO_APLICAR' && 'SI' || 'NO' }}
        run: |
          if [ "$TAPPAD_HABILITAR_CONCILIACION_PILOTO" = SI ]; then
            python conciliar_pagos_productivos_piloto.py --aplicar
          else
            python conciliar_pagos_productivos_piloto.py
          fi

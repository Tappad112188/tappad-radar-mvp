name: Conciliacion automatica piloto
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  piloto:
    if: ${{ github.ref == 'refs/heads/main' && vars.TAPPAD_PILOTO_AUTOMATICO == 'SI' }}
    runs-on: ubuntu-latest
    environment: conciliacion-piloto-automatica
    concurrency:
      group: tappad-activacion-comercial
      cancel-in-progress: false
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d544f33b57c4866444e7fdd0bc83986216b3c6a7
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'psycopg[binary]==3.2.10'
      - name: Conciliar exclusivamente piloto
        env:
          TAPPAD_POSTGRES_DSN: ${{ secrets.TAPPAD_POSTGRES_DSN }}
          TAPPAD_SUPABASE_URL: ${{ secrets.TAPPAD_SUPABASE_URL }}
          TAPPAD_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TAPPAD_SUPABASE_SERVICE_ROLE_KEY }}
          TAPPAD_MERCADOPAGO_PROD_ACCESS_TOKEN: ${{ secrets.TAPPAD_MERCADOPAGO_PROD_ACCESS_TOKEN }}
          TAPPAD_MERCADOPAGO_SELLER_ID: ${{ secrets.TAPPAD_MERCADOPAGO_SELLER_ID }}
          TAPPAD_HABILITAR_ACTIVACION_PRODUCCION: ${{ secrets.TAPPAD_HABILITAR_ACTIVACION_PRODUCCION }}
          TAPPAD_HABILITAR_CONCILIACION_PILOTO: ${{ secrets.TAPPAD_HABILITAR_CONCILIACION_PILOTO }}
        run: |
          if [ "$TAPPAD_HABILITAR_CONCILIACION_PILOTO" = SI ]; then
            python conciliar_pagos_productivos_piloto.py --aplicar
          else
            python conciliar_pagos_productivos_piloto.py
          fi

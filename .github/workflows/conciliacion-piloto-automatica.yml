name: Conciliacion automatica piloto
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  piloto:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: conciliacion-piloto-automatica
    concurrency:
      group: tappad-activacion-comercial
      cancel-in-progress: false
    timeout-minutes: 5
    steps:
      - name: Comprobar habilitacion del entorno
        env:
          HABILITADO: ${{ vars.TAPPAD_PILOTO_AUTOMATICO }}
        run: |
          if [ "$HABILITADO" != SI ]; then
            echo "Conciliacion deshabilitada"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: d544f33b57c4866444e7fdd0bc83986216b3c6a7
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'psycopg[binary]==3.2.10'
      - name: Conciliar exclusivamente piloto
        env:
          TAPPAD_POSTGRES_DSN: ${{ secrets.TAPPAD_POSTGRES_DSN }}
          TAPPAD_SUPABASE_URL: ${{ secrets.TAPPAD_SUPABASE_URL }}
          TAPPAD_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TAPPAD_SUPABASE_SERVICE_ROLE_KEY }}
          TAPPAD_MERCADOPAGO_PROD_ACCESS_TOKEN: ${{ secrets.TAPPAD_MERCADOPAGO_PROD_ACCESS_TOKEN }}
          TAPPAD_MERCADOPAGO_SELLER_ID: ${{ secrets.TAPPAD_MERCADOPAGO_SELLER_ID }}
          TAPPAD_HABILITAR_ACTIVACION_PRODUCCION: ${{ secrets.TAPPAD_HABILITAR_ACTIVACION_PRODUCCION }}
          TAPPAD_HABILITAR_CONCILIACION_PILOTO: ${{ secrets.TAPPAD_HABILITAR_CONCILIACION_PILOTO }}
        run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["TAPPAD_POSTGRES_DSN"], connect_timeout=10) as c:
              c.execute("SET LOCAL ROLE tappad_activador_privado")
              assert c.execute("SELECT session_user,current_user").fetchone()==("tappad_login_activacion","tappad_activador_privado")
              print("IDENTIDAD_TECNICA_OK")
          PY
          if [ "$TAPPAD_HABILITAR_CONCILIACION_PILOTO" = SI ] && [ "$TAPPAD_HABILITAR_ACTIVACION_PRODUCCION" = SI ]; then
            python conciliar_pagos_productivos_piloto.py --aplicar
          else
            python conciliar_pagos_productivos_piloto.py
          fi

name: Pruebas HTML TAPPAD Radar
on:
  push:
    branches: [desarrollo-registro-proveedores]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validar-correo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generar logo PNG una sola vez
        run: |
          python -m pip install "CairoSVG>=2.7.1"
          if [ ! -f assets/logo_tappad.png ]; then
            python -c "import cairosvg; cairosvg.svg2png(url='assets/logo_tappad.svg',write_to='assets/logo_tappad.png',output_width=276,output_height=276)"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/logo_tappad.png
            git commit -m "Agregar logo PNG preconvertido para correos"
            git push
          fi
      - name: Instalar dependencias del proyecto
        run: python -m pip install -r requirements.txt
      - name: Pruebas integrales de alertas y correo sin envíos
        run: python -m unittest discover -p "test_*.py" -v
      - name: Simular preparación de alertas ficticias
        run: python simulacion_programada.py

name: Pruebas HTML TAPPAD Radar
on:
  push:
    branches: [desarrollo-registro-proveedores]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar-correo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencia de imagen
        run: python -m pip install "CairoSVG>=2.7.1"
      - name: Pruebas de plantilla y MIME sin enviar correos
        run: python -m unittest -v test_plantilla_correo_html.py

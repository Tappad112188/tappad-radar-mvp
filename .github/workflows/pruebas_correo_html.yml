name: Pruebas HTML TAPPAD Radar
on:
  push:
    branches: [desarrollo-registro-proveedores]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validar-correo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generar logo PNG una sola vez
        run: |
          python -m pip install "CairoSVG>=2.7.1"
          if [ ! -f assets/logo_tappad.png ]; then
            python -c "import cairosvg; cairosvg.svg2png(url='assets/logo_tappad.svg',write_to='assets/logo_tappad.png',output_width=276,output_height=276)"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/logo_tappad.png
            git commit -m "Agregar logo PNG preconvertido para correos"
            git push
          fi
      - name: Instalar dependencias del proyecto
        run: python -m pip install -r requirements.txt
      - name: Pruebas integrales de alertas y correo sin envíos
        run: python -m unittest discover -p "test_*.py" -v
      - name: Simular preparación de alertas ficticias
        run: python simulacion_programada.py

  sincronizar-csv:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Completar fechas vacias de ComprasMX desde CSV oficial en lotes de 49
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ADMIN_KEY: ${{ secrets.SUPABASE_ADMIN_KEY }}
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_ADMIN_KEY"
          for lote in 1 2 3 4 5; do
            echo "LOTE $lote"
            python sincronizar_calendarios_comprasmx_v3.py --aplicar --max-cambios 49 --solo-vacios --por-lotes
          done
      - name: Validar remanentes sin escrituras
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ADMIN_KEY: ${{ secrets.SUPABASE_ADMIN_KEY }}
        run: python sincronizar_calendarios_comprasmx_v3.py --solo-vacios

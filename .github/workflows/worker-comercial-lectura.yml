name: TAPPAD Worker comercial (solo lectura)
on:
  workflow_dispatch:
  schedule:
    - cron: '35 15 * * *'
permissions:
  contents: read
concurrency:
  group: tappad-worker-comercial-lectura
  cancel-in-progress: false
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAPPAD_HABILITAR_ACTIVACION_PRODUCCION: 'NO'
      TAPPAD_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      TAPPAD_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_ADMIN_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0e6d934bfe49dd9b7964ec08c927a7c2ecaeeb44
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pruebas unitarias del worker
        run: |
          python -m unittest discover -s tests -p 'test_worker_activacion_comercial.py' -v
          python -m unittest discover -s tests -p 'test_conciliador_pagos_pendientes_lectura.py' -v
      - name: Diagnostico seguro de configuracion (sin pagos ni escrituras)
        run: |
          python - <<'PY'
          import os
          required = ('TAPPAD_SUPABASE_URL', 'TAPPAD_SUPABASE_SERVICE_ROLE_KEY')
          missing = [key for key in required if not os.environ.get(key)]
          print('Modo: DIAGNOSTICO_SIN_CONSULTAS_DE_PAGOS')
          print('Activacion comercial: DESHABILITADA')
          print('Supabase: ' + ('PENDIENTE' if missing else 'CONFIGURADO'))
          if missing:
              raise SystemExit('Configuracion incompleta: ' + ', '.join(missing))
          PY

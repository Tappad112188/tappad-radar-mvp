name: SECOP - prueba de navegador
on:
  workflow_dispatch:
  push:
    branches: [desarrollo-registro-proveedores]
    paths:
      - 'diagnostico_secop_navegador.py'
      - '.github/workflows/secop_navegador.yml'
permissions:
  contents: read
jobs:
  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python diagnostico_secop_navegador.py

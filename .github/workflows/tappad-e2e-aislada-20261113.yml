name: TAPPAD - E2E aislada 13 noviembre dos buzones
on:
  push:
    branches: [desarrollo-registro-proveedores]
    paths:
      - '.github/workflows/tappad-e2e-aislada-20261113.yml'
      - 'prueba_e2e_aislada_20261113.py'
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Escribir ENVIAR_PRUEBA para repetir dos correos'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: tappad-e2e-aislada-20261113
  cancel-in-progress: false
jobs:
  prueba:
    if: ${{ github.event_name == 'push' || inputs.confirmar == 'ENVIAR_PRUEBA' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generar logo PNG real desde arte corporativo SVG
        run: |
          python -m pip install 'cairosvg==2.8.2'
          python - <<'PY'
          import cairosvg
          from pathlib import Path
          raiz=Path('assets')
          cairosvg.svg2png(url=str(raiz/'logo_tappad.svg'),write_to=str(raiz/'logo_tappad.png'),output_width=330,output_height=330)
          png=(raiz/'logo_tappad.png').read_bytes()
          assert png.startswith(b'\x89PNG\r\n\x1a\n') and len(png)>1000
          print('Logotipo corporativo PNG generado y validado')
          PY
      - name: Verificar secretos y ejecutar piloto real aislado
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ADMIN_KEY: ${{ secrets.SUPABASE_ADMIN_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          TAPPAD_PRUEBA_AISLADA: 'SI'
          TAPPAD_PRUEBA_ENVIAR: 'SI'
        run: |
          python - <<'PY'
          import os
          names=('SUPABASE_URL','SUPABASE_ADMIN_KEY','SMTP_USER','SMTP_APP_PASSWORD')
          missing=[n for n in names if not os.getenv(n)]
          if missing: raise SystemExit('Secretos faltantes: '+', '.join(missing))
          PY
          python prueba_e2e_aislada_20261113.py

name: TAPPAD Radar - validacion cloud ComprasMX

on:
  workflow_dispatch:
  push:
    branches: [desarrollo-registro-proveedores]
    paths:
      - '.github/workflows/validar_alertas_tappad.yml'
      - 'simular_alertas_comprasmx_recientes.py'
      - 'diagnosticar_vigencia_v4.py'
      - 'test_clasificacion_comercial_v1.py'
      - 'test_compuerta_envio_real.py'
      - 'control_notificaciones.py'
      - 'preparador_alertas.py'
      - 'servicio_notificaciones_controlado.py'
      - 'test_servicio_notificaciones_controlado.py'
      - 'test_integral_notificaciones_seguro.py'
      - 'preflight_supabase_notificaciones_lectura.py'

permissions:
  contents: read

concurrency:
  group: tappad-validacion-segura
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TAPPAD_HEADLESS: '1'
    steps:
      - name: Obtener rama de desarrollo
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pruebas de clasificacion
        run: python -m unittest -v test_clasificacion_comercial_v1.py
      - name: Pruebas de compuerta de envios - sin SMTP
        run: python -m unittest -v test_compuerta_envio_real.py
      - name: Pruebas del servicio de notificaciones - sin red ni SMTP
        run: python -m unittest -v test_servicio_notificaciones_controlado.py
      - name: Prueba integral de notificaciones simulada - sin red ni SMTP
        run: python -m unittest -v test_integral_notificaciones_seguro.py
      - name: Diagnostico de notificaciones Supabase - solo lectura
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ADMIN_KEY: ${{ secrets.SUPABASE_ADMIN_KEY }}
        run: python preflight_supabase_notificaciones_lectura.py
      - name: Consultar ComprasMX - sin importacion
        run: python tappad_importador_automatico.py --ventana-dias 2 --limite 1000
      - name: Simular coincidencias de ComprasMX - solo lectura
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ADMIN_KEY: ${{ secrets.SUPABASE_ADMIN_KEY }}
        run: python simular_alertas_comprasmx_recientes.py --ventana-dias 2

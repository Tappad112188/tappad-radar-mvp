name: Diagnóstico SECOP Coahuila
on:
  workflow_dispatch:
  push:
    branches: [desarrollo-registro-proveedores]
    paths:
      - 'diagnostico_secop.py'
      - '.github/workflows/diagnostico_secop.yml'
permissions:
  contents: read
jobs:
  comprobar-acceso-publico:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diagnosticar acceso público sin credenciales
        run: python diagnostico_secop.py

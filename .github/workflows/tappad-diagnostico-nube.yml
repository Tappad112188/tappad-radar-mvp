name: TAPPAD Radar - Diagnostico en nube
on:
  workflow_dispatch:
  # Activar cron solo despues de validar el motor de envio y los secretos.
  # schedule:
  #   - cron: '0 0,14,19 * * *'
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desarrollo-registro-proveedores
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Comprobar variables requeridas sin exponerlas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ADMIN_KEY: ${{ secrets.SUPABASE_ADMIN_KEY }}
        run: |
          test -n "$SUPABASE_URL" || { echo 'Falta secreto SUPABASE_URL'; exit 1; }
          test -n "$SUPABASE_ADMIN_KEY" || { echo 'Falta secreto SUPABASE_ADMIN_KEY'; exit 1; }
      - name: Diagnosticar coincidencias sin envios ni escrituras
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ADMIN_KEY: ${{ secrets.SUPABASE_ADMIN_KEY }}
        run: python diagnosticar_vigencia_v4.py
      - name: Auditar destinatarios y duplicados sin enviar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ADMIN_KEY: ${{ secrets.SUPABASE_ADMIN_KEY }}
        run: python auditar_envios_produccion_v1.py
      - name: Generar HTML con logo sin enviar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ADMIN_KEY: ${{ secrets.SUPABASE_ADMIN_KEY }}
        run: python generar_borradores_gmail_v3.py
      - name: Simular plan de envios y verificar vigencia
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ADMIN_KEY: ${{ secrets.SUPABASE_ADMIN_KEY }}
        run: python planificar_envios_seco_v1.py
      - name: Preparar lote seguro sin enviar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ADMIN_KEY: ${{ secrets.SUPABASE_ADMIN_KEY }}
        run: python preparar_lote_notificaciones_v1.py
      - name: Validar motor de entrega sin enviar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ADMIN_KEY: ${{ secrets.SUPABASE_ADMIN_KEY }}
        run: python motor_entrega_tappad_v1.py
      - name: Guardar vistas previas
        uses: actions/upload-artifact@v4
        with:
          name: tappad-vistas-previas
          path: |
            diagnostico_vigencia_tappad_v4.txt
            vista_previa_alertas_tappad_v7.txt
            borradores_gmail_tappad_v3/
            plan_envios_seco_tappad.json
            manifiesto_notificaciones_tappad.json
          retention-days: 3

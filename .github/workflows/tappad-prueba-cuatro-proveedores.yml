name: TAPPAD - Prueba controlada cuatro proveedores
on:
  push:
    branches: [desarrollo-registro-proveedores]
    paths:
      - '.github/workflows/tappad-prueba-cuatro-proveedores.yml'
permissions:
  contents: read
jobs:
  prueba-cuatro-proveedores:
    if: github.event.head_commit.message == 'TAPPAD_HTML_CID_ENVIO_UNICO_20261110'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enviar solo tres alertas de prueba a correos autorizados
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ADMIN_KEY: ${{ secrets.SUPABASE_ADMIN_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
        run: python prueba_cuatro_proveedores_20261110.py --enviar

name: Auditoria comercial Mercado Pago (solo lectura)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desarrollo-registro-proveedores
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validar sintaxis del auditor
        run: python -m py_compile conciliador_pagos_pendientes_lectura.py
      - name: Pruebas unitarias sin red ni credenciales
        run: python -m unittest discover -s tests -p 'test_conciliador_pagos_pendientes_lectura.py' -v
      - name: Probar worker privado sin red
        run: python -m unittest discover -s tests -p 'test_worker_activacion_comercial.py' -v
      - name: Auditar sin modificar datos
        env:
          TAPPAD_SUPABASE_URL: ${{ secrets.TAPPAD_SUPABASE_URL }}
          TAPPAD_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TAPPAD_SUPABASE_SERVICE_ROLE_KEY }}
          TAPPAD_MERCADOPAGO_PROD_ACCESS_TOKEN: ${{ secrets.TAPPAD_MERCADOPAGO_PROD_ACCESS_TOKEN }}
        run: python conciliador_pagos_pendientes_lectura.py

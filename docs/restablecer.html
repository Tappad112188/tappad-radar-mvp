<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAPPAD Radar · Restablecer contraseña</title><style>body{font:16px system-ui;background:#f3f6fa;color:#14243a}main{max-width:520px;margin:7vh auto;background:white;border-radius:14px;padding:28px}input{display:block;box-sizing:border-box;width:100%;padding:12px;margin:12px 0;border:1px solid #aab5c4;border-radius:7px}button{background:#173e6c;color:white;padding:12px;border:0;border-radius:7px}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#173e6c}</style></head><body><main><h1>Restablecer contraseña</h1><p>Acceso administrativo TAPPAD Radar. Abre esta página desde el enlace de recuperación recibido por correo.</p><label>Clave pública de Supabase (anon/publishable)<input id="apikey" type="password" autocomplete="off" placeholder="Solo clave pública, nunca service_role ni sb_secret_"></label><label>Nueva contraseña<input id="password" type="password" minlength="12" autocomplete="new-password" placeholder="Mínimo 12 caracteres"></label><button id="save">Guardar nueva contraseña</button><pre id="status" role="status"></pre><p><a href="./">Volver al acceso administrativo</a></p></main><script>
(()=>{"use strict";const out=document.getElementById("status"),button=document.getElementById("save");const base="https://rgzjrziulhobgjfhwvfw.supabase.co";let access=null;
const hash=new URLSearchParams(location.hash.slice(1)),query=new URLSearchParams(location.search);
async function jsonFetch(path,method,body,auth){const key=document.getElementById("apikey").value.trim();if(!key||/service_role|sb_secret_/.test(key))throw Error("Introduce la clave pública de Supabase");const headers={"content-type":"application/json","apikey":key};if(auth)headers.authorization="Bearer "+auth;const res=await fetch(base+path,{method,headers,body:JSON.stringify(body)});const data=await res.json().catch(()=>({}));if(!res.ok)throw Error(data.msg||data.error_description||data.message||"Error HTTP "+res.status);return data}
async function setup(){try{
if(hash.get("error"))throw Error(hash.get("error_description")||hash.get("error"));
if(hash.get("type")==="recovery"&&hash.get("access_token")){access=hash.get("access_token");history.replaceState(null,"",location.pathname);out.textContent="Enlace de recuperación validado. Escribe una nueva contraseña.";return}
const tokenHash=query.get("token_hash");if(tokenHash&&query.get("type")==="recovery"){const d=await jsonFetch("/auth/v1/verify","POST",{token_hash:tokenHash,type:"recovery"});access=d.access_token;history.replaceState(null,"",location.pathname);out.textContent="Enlace de recuperación validado.";return}
throw Error("No se encontró una sesión de recuperación válida. Solicita un enlace nuevo desde la página de acceso.");
}catch(e){out.textContent=e.message;button.disabled=true}}
button.onclick=async()=>{button.disabled=true;try{if(!access)throw Error("Sesión de recuperación no disponible");const password=document.getElementById("password").value;if(password.length<12)throw Error("Utiliza al menos 12 caracteres");await jsonFetch("/auth/v1/user","PUT",{password},access);access=null;document.getElementById("password").value="";out.textContent="Contraseña actualizada. Vuelve a la página de acceso para iniciar sesión."}catch(e){out.textContent="Error: "+e.message;button.disabled=false}};setup()})();
</script></body></html>

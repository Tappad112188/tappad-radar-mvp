<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAPPAD Radar | Comprador de prueba</title><style>body{background:#f3f6fa;color:#14243a;font:16px system-ui,Arial;margin:0}main{max-width:640px;margin:5vh auto;background:white;border-radius:16px;padding:28px}input{width:100%;box-sizing:border-box;padding:12px;margin:5px 0 12px;border:1px solid #b5c2d2;border-radius:8px}label{display:block;font-weight:600}button{background:#173e6c;color:white;border:0;border-radius:8px;padding:12px;margin:6px 8px 6px 0;cursor:pointer}.secondary{background:#e9edf4;color:#18304d}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef2f7;padding:14px;border-radius:8px}.note{background:#fff4d6;padding:12px;border-radius:8px}</style></head><body><main><h1>TAPPAD Radar</h1><p>Registro de comprador de prueba · versión 4</p><p class="note">Esta página no cobra, no genera suscripciones y no solicita credenciales de Mercado Pago. Solo usa la clave pública de Supabase.</p><label>URL de Supabase</label><input id="url" value="https://rgzjrziulhobgjfhwvfw.supabase.co"><label>Clave pública (anon / publishable)</label><input id="key" type="password" autocomplete="off"><label>Correo del comprador</label><input id="email" type="email" value="tappadcons@gmail.com" readonly><label>Contraseña nueva del comprador</label><input id="password" type="password" autocomplete="new-password"><button id="signup">Crear cuenta de comprador</button><button id="login" class="secondary">Iniciar sesión de comprador</button><button id="link" class="secondary">Vincular cliente de prueba</button><button id="check" class="secondary">Verificar acceso de comprador</button><button id="requestmonthly" class="secondary">Solicitar plan mensual de prueba ($449, sin cobro)</button><button id="remotecheck" class="secondary">Verificar plan mensual en Mercado Pago (GET)</button><button id="subscriptions" class="secondary">Consultar mis suscripciones (GET)</button><button id="logout" class="secondary">Cerrar sesión</button><h2>Resultado</h2><pre id="out">Listo. Ninguna operación realizada.</pre></main><script>
(()=>{"use strict";const $=id=>document.getElementById(id);let access="";
const base=()=>$("url").value.trim().replace(/\/$/,""),key=()=>$("key").value.trim(),email=()=>$("email").value.trim(),password=()=>$("password").value;
const show=o=>$("out").textContent=typeof o==="string"?o:JSON.stringify(o,null,2);
async function request(path,method="GET",body,auth){
 if(!base().startsWith("https://")||!key())throw Error("Introduce la URL HTTPS y la clave pública de Supabase.");
 const r=await fetch(base()+path,{method,headers:{"apikey":key(),"Authorization":"Bearer "+(auth||key()),"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
 let data=await r.json().catch(()=>({error:"Respuesta no JSON"}));if(!r.ok)throw Error((data.error_description||data.msg||data.error||"Error")+" ("+r.status+")");return data;
}
async function run(f){for(const b of document.querySelectorAll("button"))b.disabled=true;try{show(await f())}catch(e){show("Error: "+e.message)}finally{for(const b of document.querySelectorAll("button"))b.disabled=false}}
$("signup").onclick=()=>run(async()=>{if(password().length<12)throw Error("La contraseña debe tener al menos 12 caracteres.");const x=await request("/auth/v1/signup","POST",{email:email(),password:password(),options:{emailRedirectTo:"https://tappad112188.github.io/tappad-radar-mvp/comprador.html"}});$("password").value="";return {message:"Solicitud de registro enviada. Revisa tu correo y confirma la cuenta antes de iniciar sesión.",user_created:!!x.user}});
$("login").onclick=()=>run(async()=>{const x=await request("/auth/v1/token?grant_type=password","POST",{email:email(),password:password()});access=x.access_token;$("password").value="";return {message:"Sesión de comprador iniciada.",authenticated:!!access}});
$("link").onclick=()=>run(async()=>{if(!access)throw Error("Primero inicia sesión y confirma el correo.");if(!confirm("¿Vincular este usuario verificado al cliente de prueba tapp cons? No genera cobros."))return "Cancelado.";return await request("/functions/v1/tappad-checkout-comprador","POST",{confirm:"VINCULAR_COMPRADOR_PRUEBA"},access)});
$("check").onclick=()=>run(async()=>{if(!access)throw Error("Primero inicia sesión.");return await request("/functions/v1/tappad-checkout-comprador","GET",undefined,access)});
$("requestmonthly").onclick=()=>run(async()=>{if(!access)throw Error("Primero inicia sesión.");if(!confirm("¿Registrar una solicitud PENDIENTE del plan mensual de $449 MXN? No genera cobros ni activa el servicio."))return "Cancelado.";return await request("/functions/v1/tappad-solicitar-plan-prueba","POST",{plan_code:"basico",confirm:"SOLICITAR_PLAN_MENSUAL_PRUEBA"},access)});
$("remotecheck").onclick=()=>run(async()=>{if(!access)throw Error("Primero inicia sesión.");return await request("/functions/v1/tappad-preflight-remoto-comprador","GET",undefined,access)});
$("subscriptions").onclick=()=>run(async()=>{if(!access)throw Error("Primero inicia sesión.");return await request("/functions/v1/tappad-consultar-suscripciones-comprador","GET",undefined,access)});
$("logout").onclick=()=>{access="";$("password").value="";show("Sesión local cerrada.");};
})();
</script></body></html>
